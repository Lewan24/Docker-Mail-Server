  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: archiwum.local
    restart: unless-stopped

    ports:
      # SMTP
      - "25:25"

      # SMTP Submission
      - "587:587"

      # IMAP
      - "993:993"

    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - mail-config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Europe/Warsaw
      
      OVERRIDE_HOSTNAME: mail.archiwum.local
      POSTFIX_MYHOSTNAME: mail.archiwum.local
      PERMIT_DOCKER: network
      
      SSL_TYPE: self-signed
      ENABLE_IMAP: 1
      POSTFIX_MESSAGE_SIZE_LIMIT: 52428800

      ENABLE_CLAMAV: 0
      ENABLE_RSPAMD: 0
      ENABLE_SPAMASSASSIN: 0

      ENABLE_FAIL2BAN: 0

    networks:
      - mailnet

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped

    depends_on:
      - mailserver

    ports:
      - "31080:80"

    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: 993

      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587

      ROUNDCUBEMAIL_SKIN: elastic

      ROUNDCUBEMAIL_DES_KEY: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

    volumes:
      - roundcube-db:/var/roundcube/db
      - roundcube-config:/var/roundcube/config
      # main configuration, if run in local then check code undec compose to bypass tls communication
      - roundcube-main-config:/var/www/html/config

    networks:
      - mailnet

volumes:
  mail-data:
    name: mail-archive-data
  mail-state:
    name: mail-archive-state
  mail-logs:
    name: mail-archive-logs
  mail-config:
    name: mail-archive-config
  roundcube-db:
    name: mail-archive-roundcube-db
  roundcube-config:
    name: mail-archive-roundcube-config
  roundcube-main-config:
    name: mail-archive-roundcube-main-config

networks:
  mailnet:
    name: mail-archive-network
    driver: bridge
    
